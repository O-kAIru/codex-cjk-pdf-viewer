<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CJK PDF Viewer — host file-entrypoint replay</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #edf2f7; color: #172b40; font: 14px system-ui, sans-serif; }
  header { padding: 14px 20px; background: #fff; border-bottom: 1px solid #cbd5e1; }
  h1 { margin: 0 0 5px; font-size: 20px; }
  p { margin: 5px 0; }
  .notice { color: #7c4700; }
  .metrics { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0; }
  .metrics span { white-space: nowrap; }
  #bridge-status { font-weight: 700; }
  button { padding: 6px 10px; border: 1px solid #8a9cb0; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 250px; height: calc(100vh - 156px); min-height: 460px; }
  #viewer { width: 100%; height: 100%; border: 0; background: #fff; }
  aside { padding: 10px; border-left: 1px solid #cbd5e1; overflow: auto; }
  #replay-log { margin: 0; padding-left: 18px; font: 12px/1.6 ui-monospace, monospace; overflow-wrap: anywhere; }
  #fixture-sha { font: 11px ui-monospace, monospace; overflow-wrap: anywhere; }
  @media (max-width: 850px) { main { grid-template-columns: minmax(0, 1fr); } aside { display: none; } }
</style>
<header>
  <h1>Host file-entrypoint replay</h1>
  <p class="notice">Synthetic PDF only. This is an SDK host simulation, not proof of installation in Codex.</p>
  <div class="metrics">
    <span>Bridge: <output id="bridge-status">starting</output></span>
    <span>Reads: <output id="read-count">0</output></span>
    <span>Subscribe: <output id="subscribe-count">0</output></span>
    <span>Unsubscribe: <output id="unsubscribe-count">0</output></span>
    <span>Representation: <output id="representation">—</output></span>
  </div>
  <button id="reopen" disabled>Reopen synthetic PDF</button>
  <button id="switch-file" disabled>Switch authorized resource</button>
  <button id="notify-update" disabled>Notify resource updated</button>
</header>
<main>
  <iframe id="viewer" title="CJK PDF Viewer under the official MCP AppBridge" sandbox="allow-scripts allow-same-origin" allow="clipboard-write"></iframe>
  <aside>
    <p><strong>Authorized fixture SHA-256</strong></p>
    <p id="fixture-sha"></p>
    <p><strong>Host trace</strong></p>
    <ol id="replay-log"></ol>
  </aside>
</main>
<script type="module">/* HOST_BUNDLE */</script>
</html>

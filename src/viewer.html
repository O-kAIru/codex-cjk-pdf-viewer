<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; font-src blob: data:; img-src blob: data:; connect-src 'none'; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>CJK PDF Viewer</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172b40;background:#edf1f6;color-scheme:light}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column}header{background:#fff;border-bottom:1px solid #cdd5df;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;z-index:2}button,input,select{font:inherit;font-size:13px;border:1px solid #bdc8d5;border-radius:6px;background:#fff;color:inherit;padding:7px 9px}button{cursor:pointer}button:hover:not(:disabled){background:#e8f0ff;border-color:#3b6fbd}button:disabled,input:disabled,select:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2563eb;outline-offset:2px}#open-file{background:#245fbc;color:#fff;border-color:#245fbc}#file-name{font-size:13px;font-weight:650;max-width:260px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-right:auto}.group{display:flex;align-items:center;gap:5px}#page-number{width:58px;text-align:center}#page-count{font-size:13px;min-width:30px}#search{width:175px}#find-result{font-size:12px;min-width:60px}#status{font-size:12px;padding:7px 16px;background:#f8faff;border-bottom:1px solid #dce3ec;min-height:30px}body[data-state=error] #status{background:#fff1f0;color:#a32222}#pages{flex:1;overflow:auto;padding:24px;min-height:0}#paper{position:relative;margin:0 auto;background:white;box-shadow:0 2px 12px #172b4020;overflow:hidden}canvas{display:block}#empty{margin:10vh auto;text-align:center;color:#596b7e;line-height:1.8}#empty strong{font-size:20px;display:block;color:#172b40}#file-input{display:none}dialog{border:1px solid #bdc8d5;border-radius:12px;box-shadow:0 8px 40px #172b4040;padding:24px}dialog::backdrop{background:#172b4050}#password-form{display:grid;gap:12px}#password-form label{font-weight:600}.textLayer{position:absolute;text-align:initial;inset:0;overflow:clip;opacity:1;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:1}.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}.textLayer> :not(.markedContent),.textLayer .markedContent span:not(.markedContent){z-index:1}.textLayer span.markedContent{top:0;height:0}.textLayer ::selection{background:#2b78e480}.textLayer .pdf-match{background:#f5b52a88;border-radius:2px}.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:0;cursor:default;user-select:none}.textLayer.selecting .endOfContent{top:0}@media(max-width:700px){header{gap:7px;padding:8px}#file-name{max-width:150px}#search{width:135px}#pages{padding:16px}#find-result{min-width:0}}
</style></head><body data-state="idle">
<header><button id="open-file" type="button">PDFを開く</button><input id="file-input" type="file" accept="application/pdf,.pdf"><span id="file-name">CJK PDF Viewer</span>
<div class="group" aria-label="ページ移動"><button id="previous" aria-label="前のページ">‹</button><input id="page-number" type="number" min="1" value="1" aria-label="ページ番号"><span id="page-count">/ 0</span><button id="next" aria-label="次のページ">›</button></div>
<select id="zoom" aria-label="表示倍率"><option value="fit">幅に合わせる</option><option value="50">50%</option><option value="75">75%</option><option value="100">100%</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select>
<div class="group"><input id="search" type="search" placeholder="PDF内を検索" aria-label="PDF内を検索"><button id="find-next" type="button">次を検索</button><span id="find-result" role="status"></span></div></header>
<div id="status" role="status">PDFを開いてください。ファイルは外部へ送信されません。</div>
<main id="pages"><div id="empty"><strong>日本語も、そのまま読めるPDFビューア</strong>PDFを開くと、ここに表示されます。<br>文字の選択・コピー・検索に対応しています。</div><div id="paper" hidden><canvas id="page-canvas"></canvas><div id="text-layer" class="textLayer"></div></div></main>
<dialog id="password-dialog"><form id="password-form"><label for="password">PDFのパスワード</label><input id="password" type="password" autocomplete="off" required><button type="submit">開く</button></form></dialog>
<script type="module">/* BUNDLE */</script></body></html>
